trigger:
- main

pool:
  name: 'new-agent-1'

variables:
  serviceConnection: 'Azure-Service-Connection'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

stages:
- stage: Terraform
  displayName: 'Terraform Azure VM Creation'
  jobs:
  - job: TerraformJob
    displayName: 'Create Azure VM using Terraform'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Terraform Init, Validate, Plan and Apply'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          echo "Checking Terraform version..."
          terraform version

          echo "Terraform Init..."
          terraform init \
            -backend-config="resource_group_name=rg-tfstate" \
            -backend-config="storage_account_name=santhoshstorage01" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=vm-demo.tfstate"

          echo "Terraform Validate..."
          terraform validate

          echo "Terraform Plan..."
          terraform plan \
            -var="ssh_public_key=$(sshPublicKey)" \
            -out=tfplan

          echo "Terraform Apply..."
          terraform apply -auto-approve tfplan