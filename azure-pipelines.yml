trigger:
- main

pool:
  name: 'new-agent-1'

variables:
  serviceConnection: 'Azure-Service-Connection'
  workingDirectory: '$(System.DefaultWorkingDirectory)'

stages:
- stage: Terraform
  displayName: 'Terraform Azure VM Creation'
  jobs:
  - job: TerraformJob
    displayName: 'Create Azure VM using Terraform'
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: 'Terraform Init, Validate, Plan and Apply'
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        workingDirectory: '$(workingDirectory)'
        backendServiceArm: '$(serviceConnection)'
        backendAzureRmResourceGroupName: 'rg-tfstate'
        backendAzureRmStorageAccountName: 'tfstateaccount12345'
        backendAzureRmContainerName: 'tfstate'
        backendAzureRmKey: 'vm-demo.tfstate'

          echo "Terraform Validate..."
          terraform validate

          echo "Terraform Plan..."
          terraform plan \
            -var="ssh_public_key=$(sshPublicKey)" \
            -out=tfplan

          echo "Terraform Apply..."
          terraform apply -auto-approve tfplan