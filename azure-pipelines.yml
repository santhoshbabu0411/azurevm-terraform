trigger:
- main

pool:
  vmImage: 'ubuntu-latest'

variables:
  serviceConnection: 'Azure-Service-Connection'
  workingDirectory: '$(System.DefaultWorkingDirectory)'
  terraformVersion: '1.8.5'

stages:
- stage: Terraform
  displayName: Terraform Azure VM Creation
  jobs:
  - job: TerraformJob
    displayName: Create Azure VM using Terraform
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Terraform Init Validate Plan Apply
      inputs:
        azureSubscription: '$(serviceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        workingDirectory: '$(workingDirectory)'
        inlineScript: |
          echo "Installing Terraform"
          wget -q https://releases.hashicorp.com/terraform/$(terraformVersion)/terraform_$(terraformVersion)_linux_amd64.zip
          unzip -o terraform_$(terraformVersion)_linux_amd64.zip
          sudo mv terraform /usr/local/bin/

          echo "Checking Terraform version"
          terraform version

          echo "Terraform Init"
          terraform init -backend-config="resource_group_name=rg-tfstate" -backend-config="storage_account_name=santhoshstorage01" -backend-config="container_name=tfstate" -backend-config="key=vm-demo.tfstate"

          echo "Terraform Validate"
          terraform validate

          echo "Terraform Plan"
          terraform plan -var="ssh_public_key=$(sshPublicKey)" -out=tfplan

          echo "Terraform Apply"
          terraform apply -auto-approve tfplan